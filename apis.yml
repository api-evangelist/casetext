aid: casetext
name: Casetext
description: >-
  Casetext is a legal technology company founded in 2013 by Jake Heller,
  Joanna Huey, and Laurence Pfeffer and headquartered in San Francisco, California.
  The company built one of the earliest neural-search engines for U.S. case law (Parallel
  Search) and a broader research platform covering federal and state cases, statutes,
  regulations, and secondary sources, with citator signals delivered through its SmartCite
  feature. Casetext is best known for CoCounsel, a generative-AI legal assistant released
  in March 2023 and originally built on top of OpenAI's GPT-4, that automates document
  review, deposition preparation, contract analysis, legal research memos, and database
  queries for law firms and in-house legal teams. Companion products include AllSearch,
  a private document search tool that lets firms run Parallel Search across their
  own document collections, and Compose, an automated brief-drafting product. Thomson
  Reuters acquired Casetext in June 2023 for $650 million in an all-cash deal that
  closed on August 17, 2023, and CoCounsel has since been integrated across Thomson Reuters'
  Westlaw, Practical Law, and HighQ product lines as the company's flagship legal-AI
  assistant. Casetext is now a RETIRED BRAND rather than an active provider: casetext.com
  began redirecting to a Thomson Reuters CoCounsel page on February 1, 2025, CoCounsel 1.0
  access on the Casetext platform ended March 31, 2025, and the standalone platform was shut
  down on April 1, 2025. As of August 2026 every path on the domain returns HTTP 410 Gone
  behind a hand-written retirement notice pointing users to Westlaw, and the developer-facing
  subdomains do not resolve. Casetext never published a public developer API, SDK, or
  machine-readable specification of any kind; the casetext GitHub organization holds 79
  fully archived repositories — research forks (transformers, ELECTRA, pgvector, FiD) and
  early JavaScript infrastructure utilities — and the 15 npm packages it published are
  general-purpose libraries rather than API clients, the newest released in June 2018.
