note: >-
  Casetext published 15 npm packages under its own GitHub org, every one confirmed
  first-party by a registry `repository.url` pointing at github.com/casetext. NONE of them
  is an API client library — they are general-purpose JavaScript utilities (Firebase
  promise wrappers, a Quill delta renderer, an FNV hash, a PEG.js importer, a local Lambda
  runner, a cron scheduler) open-sourced out of Casetext's own product engineering between
  2013 and 2018. There is no Casetext API for a client library to wrap.
  Because of that, NO `type: SDKs` pointer is emitted in apis.yml — an SDKs pointer would
  award the sdk_count ergonomics check for developer libraries that do not exist. Only the
  neutral `type: Packages` pointer is wired.
  As decay evidence this set is unambiguous: the most recently published package is
  ultracron 0.0.7 on 2018-06-08, more than eight years stale and five years before the
  Thomson Reuters acquisition. Every backing repository is archived.
